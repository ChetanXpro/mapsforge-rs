[package]
name = "gps"
version = "0.1.0"
edition = "2021"
description = "A Rust gps"
license = "MIT"
repository = "https://github.com/ChetanXpro/mapsforge-rs"
keywords = ["mapsforge", "maps", "osm", "parser"]
categories = ["parser-implementations", "encoding"]
authors = ["Chetan <chetanbaliyan10@gmail.com>"]
readme = "README.md"

[[example]]
name = "render_map"
path = "examples/render_map.rs"


[dependencies]
byteorder = "1.5.0"
thiserror = "1.0"
png = "0.17"  
log = "0.4"

[dev-dependencies]
tempfile = "3.8"
assert_fs = "1.0"
pretty_assertions = "1.4"